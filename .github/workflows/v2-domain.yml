name: V2 domain and server boundaries
on:
  pull_request:
    paths:
      - 'shared/v2/**'
      - 'server/v2/**'
      - 'server/security/**'
      - 'api/**'
      - 'src/**'
      - 'review/**'
      - 'review.html'
      - 'vite.config.js'
      - 'playwright.config.js'
      - 'tests/browser/**'
      - 'tests/v2/**'
      - 'tests/security/**'
      - 'tests/emulator/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firebase.emulator.json'
      - 'tsconfig.v2.json'
      - 'package*.json'
      - '.github/workflows/v2-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:v2
      - run: npm run test:v2
      - run: npm run test:security
      - run: npm run lint:v2
      - run: npx playwright install --with-deps chromium
      - run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-security-browser
          path: test-results/profile-security/
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run build:review
      - run: npm run test:ui
